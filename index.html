<title>高校足球物語</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: a coach's clipboard — school-coloured header band, card grid on a cool field-grey ground, live match as a scoreboard over a commentary column. */
:root {
  --bg: #e9eeea;
  --surface: #ffffff;
  --surface-2: #f3f6f4;
  --ink: #16201b;
  --muted: #5b6a62;
  --line: #d3dcd6;
  --pitch: #1d6a45;
  --pitch-2: #237a50;
  --chalk: #f4f8f5;
  --gold: #b9821a;
  --good: #1f8a52;
  --warn: #c48a12;
  --bad: #c2412f;
  --theirs: #8796a0;
  --stat-l: #15244e;
  --stat-r: #a6ecec;
  --stat-r-ink: #0f3f42;
  --team-l: 38%;
  --f-display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", "Noto Serif TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1512; --surface: #17201b; --surface-2: #1d2822; --ink: #e5ede8; --muted: #92a39a; --line: #2b3832;
  --pitch: #1b5c3d; --pitch-2: #206847; --chalk: #e8f1ec; --gold: #e0ab45; --good: #46b97a; --warn: #e2ad3c; --bad: #e46a55; --theirs: #6f7f88; --team-l: 52%; --stat-l: #3557b5; --stat-r: #2f8f93; --stat-r-ink: #e9fbfb; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #17201b; --surface-2: #1d2822; --ink: #e5ede8; --muted: #92a39a; --line: #2b3832;
  --pitch: #1b5c3d; --pitch-2: #206847; --chalk: #e8f1ec; --gold: #e0ab45; --good: #46b97a; --warn: #e2ad3c; --bad: #e46a55; --theirs: #6f7f88; --team-l: 52%; --stat-l: #3557b5; --stat-r: #2f8f93; --stat-r-ink: #e9fbfb; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid hsl(var(--h, 150) 60% var(--team-l)); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.display { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
.gutter, .start, .top-inner, .tabs, .main, .advance-inner, .match { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--pitch); border-color: var(--pitch); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--pitch-2); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.btn.big { padding: 11px 22px; font-size: 15px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg.wrap { flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-right: 1px solid var(--line); font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: var(--surface); }
.seg button:disabled { opacity: .5; cursor: not-allowed; }
.link { border: 0; background: none; padding: 0; text-align: left; }
.link:hover b { text-decoration: underline; }
select { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 4px 6px; font-size: 12.5px; max-width: 100%; }

/* ---------- tags, bars, crests ---------- */
.tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; white-space: nowrap; vertical-align: 1px; }
.tag.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.tag.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.tag.hot { color: #fff; background: var(--bad); border-color: var(--bad); }
.tag.trait { margin-left: 0; color: var(--ink); background: var(--surface-2); }
.tag.block { display: block; margin: 0 0 10px; border-radius: 8px; padding: 6px 10px; }
.bar { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--ink); opacity: .75; }
.bar.good i { background: var(--good); opacity: 1; }
.bar.warn i { background: var(--warn); opacity: 1; }
.bar.bad i { background: var(--bad); opacity: 1; }
.bar.neutral i { background: var(--muted); }
.bar.attr-bar i { background: hsl(var(--h, 150) 55% var(--team-l)); opacity: 1; }
.crest { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px 6px 11px 11px; background: hsl(var(--h) 55% var(--team-l)); color: #fff; font-family: var(--f-display); font-size: 12.5px; font-weight: 700; margin-right: 6px; flex: none; vertical-align: middle; }
.crest.big { width: 34px; height: 36px; font-size: 18px; border-radius: 8px 8px 17px 17px; }
.st { white-space: nowrap; letter-spacing: -1px; font-size: 13px; }
.st i { font-style: normal; color: var(--line); }
.st i.f { color: var(--gold); }
.st i.h { background: linear-gradient(90deg, var(--gold) 50%, var(--line) 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pos { display: inline-block; font-family: var(--f-num); font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 4px; color: #fff; }
.pos.GK { background: #b07a12; } .pos.DF { background: #2e6fb0; } .pos.MF { background: #2f8a5a; } .pos.FW { background: #c2412f; }
.pos.big { font-size: 15px; padding: 6px 9px; border-radius: 8px; }
.fm { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.fm i { font-style: normal; display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; color: #fff; font-size: 11px; line-height: 1; }
.fm.f4 { color: #d2452c; } .fm.f4 i { background: #e2502f; }
.fm.f3 { color: #d07a12; } .fm.f3 i { background: #e8901c; }
.fm.f2 { color: #3f9a4f; } .fm.f2 i { background: #4aa85a; }
.fm.f1 { color: #3a78b8; } .fm.f1 i { background: #4a86c5; }
.fm.f0 { color: #6b5bb5; } .fm.f0 i { background: #7466c2; }
.slot .fm i { width: 15px; height: 15px; font-size: 10px; }
.cap { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; background: var(--gold); color: #fff; font-family: var(--f-num); font-size: 10.5px; font-weight: 700; margin: 0 4px; vertical-align: 1px; }
.slot .cap { margin: 0 3px 0 0; }
.rk { display: inline-block; font-size: 10.5px; padding: 0 4px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-left: 3px; vertical-align: 1px; }
.role-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
.role-row select { width: 100%; }
.roles { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
.roles .lbl { margin: 0; }
.up { color: var(--good); font-family: var(--f-num); margin-left: 4px; }
.neg { color: var(--bad); }

/* ---------- start ---------- */
.start { max-width: 1120px; margin: 0 auto; padding-block: 40px 120px; }
.start-head { max-width: 680px; margin-bottom: 36px; }
.eyebrow { font-size: 12.5px; letter-spacing: .14em; color: var(--pitch); font-weight: 700; margin: 0 0 6px; }
.start h1 { font-size: clamp(44px, 9vw, 84px); line-height: 1.05; margin: 0 0 14px; }
.lede { font-size: 16px; color: var(--muted); max-width: 34em; margin: 0; }
.school-card { display: flex; align-items: center; gap: 12px; margin-top: 22px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); max-width: 420px; }
.school-card .school-name { font-family: var(--f-display); font-size: 20px; }
.coach-form { margin-top: 22px; max-width: 520px; display: grid; gap: 6px; }
.coach-form label { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.coach-row { display: flex; gap: 8px; flex-wrap: wrap; }
.coach-row input { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.coach-row input:focus-visible { outline: 2px solid hsl(var(--h, 150) 55% var(--team-l)); outline-offset: 1px; }
.coach-err { color: var(--bad); margin: 0; }
.resume { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.h2 { font-family: var(--f-display); font-size: 24px; margin: 8px 0 4px; }
.group { margin-top: 22px; }
.group-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
.group-head h3 { margin: 0; font-size: 15px; }
.school-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.school { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto; column-gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; }
.school .crest { grid-row: 1 / 4; }
.school-name { font-weight: 700; }
.school-meta { font-size: 12px; color: var(--muted); }
.school:hover { border-color: hsl(var(--h) 50% var(--team-l)); }
.school.on { border-color: hsl(var(--h) 55% var(--team-l)); box-shadow: 0 0 0 2px hsl(var(--h) 55% var(--team-l)); }
.start-foot { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border-top: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }

/* ---------- header ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; }
.top::before { content: ""; display: block; height: 5px; background: hsl(var(--h) 55% var(--team-l)); }
.top-inner { max-width: 1120px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 10px 6px; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 4px; min-width: 0; }
.who .crest { width: 34px; height: 36px; font-size: 18px; border-radius: 8px 8px 17px 17px; }
.school-title { font-family: var(--f-display); font-size: 20px; font-weight: 700; line-height: 1.2; }
.when { text-align: right; }
.cal { display: flex; gap: 8px; align-items: baseline; justify-content: flex-end; }
.cal-y { font-size: 12.5px; color: var(--muted); }
.cal-m { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.cal-w { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.tabs { max-width: 1120px; margin: 0 auto; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 9px 12px 10px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: hsl(var(--h) 55% var(--team-l)); }
.pip { font-family: var(--f-num); font-size: 10.5px; background: var(--pitch); color: #fff; border-radius: 99px; padding: 0 5px; margin-left: 5px; vertical-align: 1px; }

/* ---------- main grid ---------- */
.main { max-width: 1120px; margin: 0 auto; padding-block: 18px 120px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card-k { font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
.grid-home { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-two .wide, .grid-home .news { grid-column: 1 / -1; }
.grid-tac { display: grid; grid-template-columns: 280px 1fr 260px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .grid-tac { grid-template-columns: 1fr 1fr; } .pitch-card { grid-column: 1 / -1; order: -1; } }
@media (max-width: 760px) { .grid-home, .grid-two, .grid-tac { grid-template-columns: 1fr; } }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.row-between .card-k { margin: 0; }
.stat-row { display: flex; gap: 22px; flex-wrap: wrap; margin: 12px 0 6px; }
.stat-row > div { display: flex; flex-direction: column; }
.stat-row b { font-size: 20px; line-height: 1.2; }
.stat-row.tight { gap: 16px; margin: 0; }
.lbl { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }

/* match preview */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 4px 0 8px; }
.vs-side { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 20px; font-family: var(--f-display); }
.vs-side .crest { width: 30px; height: 32px; font-size: 16px; }
.vs-mid { font-family: var(--f-num); color: var(--muted); font-size: 13px; }
.duel { display: grid; gap: 8px; margin: 14px 0 8px; }
.duel-row { display: grid; grid-template-columns: 34px 1fr 34px 64px; align-items: center; gap: 8px; }
.duel-row .num:last-of-type { text-align: left; }
.duel-row .num:first-child { text-align: right; }
.duel-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
.duel-bar i { display: block; height: 100%; }
.duel-bar i.mine, .sw.mine { background: hsl(var(--h, 150) 55% var(--team-l)); }
.duel-bar i.theirs, .sw.theirs { background: var(--theirs); }
.duel-l { font-size: 12.5px; color: var(--muted); }
.legend { display: flex; gap: 14px; color: var(--muted); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.match-card .muted.center { margin-top: 2px; }
.match-card, .top { --h: inherit; }
main .card { --h: inherit; }

.results { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.results li { display: grid; grid-template-columns: 28px 64px 1fr auto; align-items: center; gap: 8px; }
.res { display: inline-grid; place-items: center; width: 24px; height: 22px; border-radius: 5px; font-size: 12px; font-weight: 700; color: #fff; }
.res.w { background: var(--good); } .res.l { background: var(--bad); } .res.d { background: var(--muted); }
td .res { width: auto; padding: 0 6px; font-family: var(--f-num); }
.score small { font-size: 10.5px; color: var(--muted); }
.log { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.log li { display: grid; grid-template-columns: 84px 1fr; gap: 8px; padding-left: 8px; border-left: 3px solid var(--line); }
.log li.good { border-left-color: var(--good); } .log li.bad { border-left-color: var(--bad); } .log li.big { border-left-color: var(--gold); font-weight: 500; }

/* tables */
.scroll-x { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.tbl .r { text-align: right; }
.tbl tr.xi td { background: color-mix(in srgb, hsl(var(--h, 150) 55% var(--team-l)) 8%, transparent); }
.players tbody tr { cursor: pointer; }
.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; white-space: nowrap; cursor: pointer; }
.sort:hover { color: var(--ink); }
.sort.on { color: var(--ink); font-weight: 700; }
.tbl th.r .sort { width: 100%; text-align: right; }
.sort-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.players tbody tr:hover td { background: var(--surface-2); }
.tbl tr.mine td { background: color-mix(in srgb, var(--gold) 14%, transparent); font-weight: 700; }
.tbl.hist tr.tot td { border-top: 2px solid var(--line); }
.tbl tr.now td { background: var(--surface-2); }
.standings tr.zone-down td:first-child { box-shadow: inset 3px 0 var(--bad); }
.standings tr.zone-up td:first-child { box-shadow: inset 3px 0 var(--good); }
.form { display: inline-flex; gap: 3px; vertical-align: middle; }
.form i { width: 8px; height: 8px; border-radius: 2px; background: var(--muted); }
.form i.W { background: var(--good); } .form i.L { background: var(--bad); }
.acts { display: flex; gap: 4px; align-items: center; }
.know { display: inline-flex; gap: 3px; }
.know i { width: 12px; height: 6px; border-radius: 2px; background: var(--line); }
.know i.on { background: var(--pitch); }
.recruit-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.recruit-head p { max-width: 42em; margin: 0; }

/* training */
.week-plan { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .week-plan { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.day { display: grid; gap: 4px; align-content: start; }
.day-h { font-family: var(--f-display); font-size: 16px; font-weight: 700; padding-bottom: 2px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
.menu { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 6px; font-size: 12.5px; text-align: left; }
.menu.on { background: var(--pitch); border-color: var(--pitch); color: #fff; font-weight: 700; }
.defs { margin: 0; display: grid; gap: 6px; }
.defs div { display: grid; grid-template-columns: 70px 1fr; gap: 8px; }
.defs dt { font-weight: 700; } .defs dd { margin: 0; color: var(--muted); font-size: 13px; }
.attr { display: grid; grid-template-columns: 72px 1fr 52px; align-items: center; gap: 8px; margin: 5px 0; }
.attr .bar { width: 100%; }
.attr b { text-align: right; font-size: 12.5px; }
.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.plain li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.plain.tight { gap: 4px; font-size: 12.5px; }
.beats { margin-top: 12px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; }

/* tactics pitch */
.pitch { position: relative; border-radius: 12px; padding: 16px 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
  background:
    linear-gradient(var(--chalk), var(--chalk)) center 50% / 100% 1px no-repeat,
    radial-gradient(circle at 50% 50%, transparent 56px, color-mix(in srgb, var(--chalk) 55%, transparent) 57px, transparent 58px),
    repeating-linear-gradient(0deg, var(--pitch) 0 48px, var(--pitch-2) 48px 96px);
  border: 2px solid color-mix(in srgb, var(--chalk) 60%, transparent); }
.prow { display: flex; justify-content: space-evenly; gap: 6px; flex-wrap: nowrap; }
.slot { width: 104px; min-width: 0; flex: 0 1 104px; display: grid; gap: 2px; justify-items: center; padding: 6px 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: rgba(8, 24, 16, .55); color: #f4f8f5; font-size: 12px; }
.slot:hover { background: rgba(8, 24, 16, .75); }
.slot.on { outline: 2px solid var(--gold); background: rgba(8, 24, 16, .85); }
.slot.off { border-color: #ff8a73; box-shadow: inset 0 0 0 1px #ff8a73; }
.slot-num { font-size: 15px; font-weight: 600; }
.slot-name { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .bar { width: 70%; height: 4px; background: rgba(255,255,255,.18); box-shadow: none; }
@media (max-width: 560px) { .slot { font-size: 11px; padding: 5px 2px; } .slot-num { font-size: 13px; } .prow { gap: 3px; } }

/* ---------- live match ---------- */

}

  // ---------- week flow ----------

  function myFixture(w = S.week) { return (S.fixtures[w] || []).find(f => f.h === S.me || f.a === S.me) || null; }

  }

    tickSuspensions([...playedIds]);
    const w = S.week;
    const C = CUP_OF_WEEK(w);

  function cupResultOf(id, key = 'wc') {

    cup.rounds.forEach((r, i) => { const m = r.find(x => x.h === id || x.a === id); if (m) reached = m.w === id && i === 4 ? '冠軍' : m.w && m.w !== id ? (i === 4 ? '亞軍' : CUP_ROUNDS[i]) : CUP_ROUNDS[i]; });

  // what a graduating third-year does next; better players are more likely to keep playing

  function graduatePath(p, career) {

      const target = ({ S: 78 - pos * 2.5, P: 55 - pos * 1.8, R: 38 - pos * 1.3 }[t.div] ?? 38 - pos) + (bonus[cupResultOf(t.id, 'wc')] || 0) + (bonus[cupResultOf(t.id, 'ih')] || 0) * 0.7;

    S.flags = { principal: false }; S.event = null;

    log(`第 ${S.year} 學年開始！${divName(me.div)}，${squad(me).filter(p => p.grade === 1).length} 名新生入隊。`, 'big');

      if (k.frontNum && p.number) o += `<text x="160" y="124" text-anchor="middle" font-family="${NUMF}" font-weight="800" font-size="32" fill="${k.numColor}"${fx(3)}>${esc(p.number)}</text>`;
      if (k.chest) o += `<text x="200" y="196" text-anchor="middle" font-family="${NUMF}" font-weight="800" font-size="28" letter-spacing="3" fill="${k.numColor}"${fx(3)}>${esc(k.chest.toUpperCase())}</text>`;
    } else {
      if (k.numStyle === 'panel') o += `<rect x="122" y="74" width="156" height="196" rx="14" fill="${k.primary}"/>`;
      if (p.name) o += `<text x="200" y="106" text-anchor="middle" font-family="${NUMF},${UIF}" font-weight="700" font-size="25" letter-spacing="4"${String(p.name).length > 6 ? ' textLength="170" lengthAdjust="spacingAndGlyphs"' : ''} fill="${k.numColor}"${fx(2.5)}>${esc(String(p.name).toUpperCase())}</text>`;
      if (p.number) o += `<text x="200" y="252" text-anchor="middle" font-family="${NUMF}" font-weight="800" font-size="150" letter-spacing="-2" fill="${k.numColor}"${fx(6)}>${esc(p.number)}</text>`;
    }
    return o;
  }
  const kitSVG = (s, key, view, player, cls = '') => `<svg class="${cls}" viewBox="20 20 360 575" role="img" aria-label="${KITS[key]}球衣">${kitInner(s, key, view || 'front', player)}</svg>`;

  // a simple kit for the other schools, from their colour
  const PATS = ['solid', 'stripes', 'hoops', 'sash', 'halves', 'pinstripe', 'chevron', 'yoke'];
  // a varied, stable crest for each of the other schools, seeded by its name
  function hashStr(str) { let h = 2166136261; for (const ch of String(str)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function seeded(seed) { let a = seed || 1; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const ACCENTS = ['#d9b44a', '#f2c230', '#f4f1e6', '#ffffff', '#c0c6ca', '#0f2a4a', '#0b0b0c', '#b3122e', '#5aa9e6', '#e86a1c'];
  const CREST_SYMS = ['leaf', 'star', 'ball', 'wave', 'mountain', 'wing', 'flame', 'bolt', 'sakura', 'eagle', 'wolf', 'bear', 'fox', 'lion', 'horse', 'koi', 'mono', 'mono', 'mono'];
  const crestCache = {};
  function teamCrest(t) {
    const key = t.id + '|' + t.name + '|' + t.hue;
    if (crestCache[key]) return crestCache[key];
    const r = seeded(hashStr(t.name) ^ (t.id * 2654435761)), pk = a => a[Math.floor(r() * a.length)];
    const p = hsl2hex(t.hue, 55, 38);
    const dark = r() < .3;                                   // some schools use a dark field with the team colour as accent
    const bg = dark ? pk(['#0f2a4a', '#0b0b0c', '#2b2f33', '#7a1d2b']) : p;
    const accent = pk(ACCENTS.filter(c => contrast(c, bg) > 1.8));
    const bg2 = dark ? p : hsl2hex(t.hue, 50, r() < .5 ? 28 : 50);
    const fg = pk(['#ffffff', '#f4f1e6', accent].filter(c => contrast(c, bg) > 2.6).concat(['#ffffff']));
    const est = String(1900 + Math.floor(r() * 85));
    const d = { school: { name: t.name, short: t.short, est },
      crest: { shape: pk(Object.keys(SHAPES)), field: pk(['solid', 'solid', 'halves', 'stripes', 'quarters', 'bend']), bg, bg2, fg, accent,
        symbol: pk(CREST_SYMS), mono: Array.from(t.short)[0], border: pk(['double', 'single', 'single', 'none']), band: r() < .6, year: r() < .55 } };
    return (crestCache[key] = d);
  }
  function teamDesign(t) {
    const p = hsl2hex(t.hue, 55, 38), dark = '#1b1f1d', light = '#f4f1e6', c = teamCrest(t);
    return { school: c.school, crest: c.crest, player: {},
      kits: { home: kit(p, light, light, PATS[t.id % PATS.length], ['crew', 'v', 'polo'][t.id % 3], { numColor: light, shorts: t.id % 2 ? light : p, shortsTrim: t.id % 2 ? p : light, socks: p, socksBand: light }),
              away: kit(light, p, p, PATS[(t.id + 3) % PATS.length], 'crew', { numColor: p, shorts: p, shortsTrim: light, socks: light, socksBand: p }),
              gk: kit(dark, '#f2c230', '#f2c230', 'solid', 'polo', { frontNum: false, shorts: dark, shortsTrim: '#f2c230', socks: dark, socksBand: '#f2c230' }) } };
  }

  /* ---------- studio (the 隊服 tab) ---------- */
  const OPT = {
    shape: [['heater', '盾形'], ['shield', '方盾'], ['round', '圓章'], ['pennant', '錦旗'], ['octagon', '八角'], ['diamond', '菱形']],
    symbol: [['leaf', '葉'], ['star', '星'], ['ball', '足球'], ['wave', '浪'], ['mountain', '山'], ['wing', '翼'], ['flame', '焰'], ['bolt', '閃電'], ['sakura', '櫻'], ['eagle', '鷹'], ['wolf', '狼'], ['bear', '熊'], ['fox', '狐'], ['lion', '獅'], ['horse', '馬'], ['koi', '鯉'], ['mono', '校名首字']],
    field: [['solid', '單色'], ['halves', '左右分'], ['stripes', '直條'], ['quarters', '四分'], ['bend', '斜帶']],
    border: [['double', '雙線'], ['single', '單線'], ['none', '無邊框']],
    pattern: [['solid', '單色'], ['stripes', '直條'], ['pinstripe', '細直條'], ['hoops', '橫條'], ['bands', '胸前雙橫'], ['halves', '左右分'], ['quarters', '四分'], ['sash', '斜肩帶'], ['chevron', 'V 字'], ['yoke', '肩部拼色'], ['fade', '漸層']],
    collar: [['crew', '圓領'], ['v', 'V 領'], ['polo', 'Polo 領']],
    sleeves: [['match', '同主色'], ['secondary', '副色'], ['trim', '滾邊色']],
    numStyle: [['solid', '實心'], ['outline', '描邊'], ['panel', '號碼底板']],
    shortsStripe: [['side', '側條'], ['double', '雙側條'], ['none', '無']],
  };
  const PALS = [['#1f6b47', '#f4f1e6', '#d9b44a'], ['#0f2a4a', '#ffffff', '#5aa9e6'], ['#b3122e', '#ffffff', '#f2c230'], ['#0b0b0c', '#f2c230', '#f2c230'], ['#ffffff', '#0f2a4a', '#b3122e'], ['#e86a1c', '#0b0b0c', '#ffffff'], ['#5aa9e6', '#ffffff', '#0f2a4a'], ['#7a1d2b', '#5aa9e6', '#ffffff'], ['#6b3fa0', '#ffffff', '#f2c230'], ['#f4f1e6', '#7a1d2b', '#7a1d2b'], ['#2b2f33', '#e8a0b4', '#ffffff'], ['#1d4ed8', '#ffffff', '#b3122e'], ['#f2c230', '#1d4ed8', '#1d4ed8'], ['#9aa3a8', '#0f2a4a', '#e86a1c'], ['#2e8b57', '#0b0b0c', '#ffffff']];
  const rpick = a => a[Math.floor(Math.random() * a.length)];

  // the parts of a design that a kit change is charged for
  const sig = s => JSON.stringify([s.school.short, s.school.est, s.crest, s.kits]);
  // mount the designer into root. st is a working draft (edited in place); committed is the confirmed design.
  function mount(root, st, { toast, committed, locked, cost, budget, onCommit, onDiscard }) {
    const $ = s => root.querySelector(s);
    const cur = () => st.kits[st.active];
    const resolve = p => p.replace('*', st.active).split('.');
    const get = p => resolve(p).reduce((o, k) => o == null ? o : o[k], st);
    const set = (p, v) => { const ks = resolve(p), last = ks.pop(); ks.reduce((o, k) => o[k], st)[last] = v; };
    const fid = p => 'ks-' + p.replace('*', 'k').replace(/\./g, '-');
    function patternIcon(v) { const k = Object.assign({}, cur(), { pattern: v }), id = uid(), b = bodyPath('Q200,62 235,40');
      return `<svg viewBox="22 22 356 300" aria-hidden="true"><defs><clipPath id="${id}b"><path d="${b}"/></clipPath>${FADE(id, k)}</defs><path d="${LS}" fill="${k.primary}" stroke="${EDGE}" stroke-width="5"/><path d="${RS}" fill="${k.primary}" stroke="${EDGE}" stroke-width="5"/><g clip-path="url(#${id}b)"><rect width="400" height="400" fill="${k.primary}"/>${pattern(k, id)}</g><path d="${b}" fill="none" stroke="${EDGE}" stroke-width="5"/></svg>`; }
    const ICON = {
      pattern: patternIcon,
      shape: v => { const c = st.crest; return `<svg viewBox="-4 -4 108 128" aria-hidden="true"><path d="${SHAPES[v].d}" fill="${c.bg}" stroke="${c.accent}" stroke-width="6" stroke-linejoin="round"/></svg>`; },
      symbol: v => { const c = st.crest; return `<svg viewBox="-32 -32 64 64" aria-hidden="true"><circle r="31" fill="${c.bg}"/><g transform="scale(.88)">${SYM[v](c, st)}</g></svg>`; },
      field: v => { const c = Object.assign({}, st.crest, { field: v }), id = uid(), d = SHAPES.heater.d; return `<svg viewBox="-4 -4 108 128" aria-hidden="true"><defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs><g clip-path="url(#${id})"><rect width="100" height="120" fill="${c.bg}"/>${fieldPat(c)}</g><path d="${d}" fill="none" stroke="${c.accent}" stroke-width="5"/></svg>`; },
    };
    const optsF = (label, path, list, icon) => `<div class="field"><div class="flabel">${label}</div><div class="opts${icon ? ' has-icon' : ''}" data-kind="opts" data-path="${path}"${icon ? ` data-icon="${icon}"` : ''}>${list.map(([v, t]) => `<button type="button" class="opt" data-val="${v}">${icon ? '<span class="ico"></span>' : ''}<span>${t}</span></button>`).join('')}</div></div>`;
    const colorF = (label, path) => `<div class="field"><div class="flabel"><span>${label}</span><span class="hex"></span></div><div class="swatches" data-kind="color" data-path="${path}">${SW.map(c => `<button type="button" class="sw" data-val="${c}" style="--c:${c}" aria-label="${label} ${c}"></button>`).join('')}<label class="sw custom" title="自訂顏色"><input type="color" id="${fid(path)}" aria-label="${label}自訂顏色"></label></div></div>`;
    const textF = (label, path, attrs) => `<div class="field"><label class="flabel" for="${fid(path)}">${label}</label><input class="txt" id="${fid(path)}" data-kind="text" data-path="${path}" autocomplete="off" ${attrs || ''}></div>`;
    const togF = (label, path) => `<label class="toggle"><span>${label}</span><input type="checkbox" role="switch" id="${fid(path)}" data-kind="toggle" data-path="${path}"><i></i></label>`;

    root.innerHTML = `
    <div class="ks-layout">
      <div class="ks-left">
        <section class="ks-stage" aria-label="預覽">
          <div class="ks-stage-bar">
            <div class="ks-seg" data-role="kitTabs" role="group" aria-label="球衣">${Object.entries(KITS).map(([k, l]) => `<button type="button" data-kit="${k}">${l}</button>`).join('')}</div>
            <div class="ks-seg" data-role="viewTabs" role="group" aria-label="視角"><button type="button" data-view="front">正面</button><button type="button" data-view="back">背面</button></div>
          </div>
          <div class="ks-stage-main">
            <figure class="ks-crest-fig"><svg data-role="crestBig" viewBox="-4 -4 108 128" role="img" aria-label="隊徽"></svg><figcaption><div class="nm" data-role="capName"></div><div class="sub" data-role="capSub"></div></figcaption></figure>
            <figure class="ks-kit-fig"><svg data-role="kitBig" viewBox="20 20 360 575" role="img" aria-label="球衣球褲預覽"></svg></figure>
          </div>
        </section>
        <div class="ks-under">
          <div class="ks-lineup" data-role="lineup"></div>
          <div class="ks-actions">
            <button type="button" class="btn" data-role="random">隨機配色</button>
            <button type="button" class="btn" data-role="reset">重設</button>
          </div>
          <div class="ks-commit" data-role="commitBox"></div>
        </div>
      </div>
      <div class="ks-panel">
        <section class="ks-sec">
          <h2>學校。<span>套用一組範本，或從零開始。校名固定為 ${esc(st.school.name)}。</span></h2>
          <div class="ks-presets">${PRESETS.map((p, i) => `<button type="button" class="ks-preset" data-preset="${i}"><svg viewBox="-4 -4 108 128" aria-hidden="true">${crestInner({ school: { name: st.school.name, short: p.school.short, est: p.school.est }, crest: p.crest })}</svg>${esc(p.label)}</button>`).join('')}</div>
          <div class="ks-row">${textF('英文縮寫', 'school.short', 'maxlength="6"')}${textF('創校年', 'school.est', 'maxlength="4" inputmode="numeric"')}</div>
        </section>
        <section class="ks-sec">
          <h2>隊徽。<span>外形、圖案與底紋，決定學校的門面。</span></h2>
          ${optsF('外形', 'crest.shape', OPT.shape, 'shape')}
          ${optsF('圖案', 'crest.symbol', OPT.symbol, 'symbol')}
          ${optsF('底紋', 'crest.field', OPT.field, 'field')}
          <div class="ks-two">${colorF('底色', 'crest.bg')}${colorF('第二底色', 'crest.bg2')}${colorF('圖案色', 'crest.fg')}${colorF('邊框與緞帶', 'crest.accent')}</div>
          ${optsF('邊框', 'crest.border', OPT.border)}
          <div class="ks-toggles">${togF('縮寫緞帶', 'crest.band')}${togF('創校年份', 'crest.year')}</div>
        </section>
        <section class="ks-sec">
          <h2>球衣。<span>正在編輯<b data-role="kitLabel"></b>球衣，可在預覽上方切換。</span></h2>
          ${optsF('樣式', 'kits.*.pattern', OPT.pattern, 'pattern')}
          <div class="ks-two">${colorF('主色', 'kits.*.primary')}${colorF('副色', 'kits.*.secondary')}${colorF('滾邊色', 'kits.*.trim')}${colorF('文字與號碼', 'kits.*.numColor')}</div>
          ${optsF('領口', 'kits.*.collar', OPT.collar)}
          ${optsF('袖子', 'kits.*.sleeves', OPT.sleeves)}
          ${optsF('號碼樣式', 'kits.*.numStyle', OPT.numStyle)}
          <div class="ks-row">${textF('胸前文字', 'kits.*.chest', 'maxlength="10"')}</div>
          <div class="ks-toggles">${togF('袖口滾邊', 'kits.*.cuffs')}${togF('胸前小號碼', 'kits.*.frontNum')}</div>
        </section>
        <section class="ks-sec">
          <h2>球褲與球襪。<span>配色常與上衣互換，客場尤其如此。</span></h2>
          <div class="ks-two">${colorF('球褲', 'kits.*.shorts')}${colorF('褲頭與條紋', 'kits.*.shortsTrim')}${colorF('球襪', 'kits.*.socks')}${colorF('球襪環帶', 'kits.*.socksBand')}</div>
          ${optsF('球褲側條', 'kits.*.shortsStripe', OPT.shortsStripe)}
        </section>
      </div>
    </div>
    `;

    function sync() {
      root.querySelectorAll('[data-kind]').forEach(el => {
        const v = get(el.dataset.path);
        if (el.dataset.kind === 'opts') {
          el.querySelectorAll('.opt').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.val === v)); if (el.dataset.icon) b.querySelector('.ico').innerHTML = ICON[el.dataset.icon](b.dataset.val); });
        } else if (el.dataset.kind === 'color') {
          let hit = false; el.querySelectorAll('.sw[data-val]').forEach(b => { const on = b.dataset.val.toLowerCase() === String(v).toLowerCase(); hit = hit || on; b.setAttribute('aria-pressed', String(on)); });
          const cu = el.querySelector('.custom'); cu.classList.toggle('on', !hit); cu.style.setProperty('--c', v);
          const inp = cu.querySelector('input'); if (document.activeElement !== inp) inp.value = v;
          el.parentElement.querySelector('.hex').textContent = String(v).toUpperCase();
        } else if (el.dataset.kind === 'text') { if (document.activeElement !== el) el.value = v ?? ''; }
        else if (el.dataset.kind === 'toggle') el.checked = !!v;
      });
      $('[data-role=kitLabel]').textContent = KITS[st.active];
    }
    function render() {
      $('[data-role=crestBig]').innerHTML = crestInner(st);
      $('[data-role=kitBig]').innerHTML = kitInner(st, st.active, st.view);
      $('[data-role=capName]').textContent = st.school.name;
      $('[data-role=capSub]').textContent = [(st.school.short || '').toUpperCase(), st.school.est ? 'EST. ' + st.school.est : ''].filter(Boolean).join(' · ');
      $('[data-role=lineup]').innerHTML = Object.keys(KITS).map(k => `<button type="button" data-kit="${k}" aria-pressed="${k === st.active}"><svg viewBox="20 20 360 575" aria-hidden="true">${kitInner(st, k, 'front')}</svg><span>${KITS[k]}</span></button>`).join('');
      root.querySelectorAll('[data-role=kitTabs] button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kit === st.active)));
      root.querySelectorAll('[data-role=viewTabs] button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === st.view)));
    }
    function commitBox() {
      const dirty = sig(st) !== sig(committed);
      $('[data-role=commitBox]').innerHTML = !locked
        ? `<p class="small muted">隊服確定之前可以免費修改。確定之後，每次更改需花費 ${cost} 萬元。</p><button type="button" class="btn primary" data-role="commit">確定隊服</button>`
        : `<p class="small muted">${dirty ? `有尚未儲存的變更。儲存需花費 <b>${cost} 萬</b>（目前預算 ${budget} 萬）。` : `隊服已確定。之後每次更改需花費 ${cost} 萬元，目前預算 ${budget} 萬。`}</p>
           <div class="ks-actions"><button type="button" class="btn primary" data-role="commit" ${dirty && budget >= cost ? '' : 'disabled'}>儲存變更・花費 ${cost} 萬</button><button type="button" class="btn" data-role="discard" ${dirty ? '' : 'disabled'}>放棄變更</button></div>
           ${dirty && budget < cost ? '<p class="small bad-ink">預算不足，無法更改隊服。</p>' : ''}`;
    }
    function update() { render(); sync(); commitBox(); }

    root.addEventListener('click', e => {
      const pr = e.target.closest('.ks-preset');
      if (pr) { const p = clone(PRESETS[+pr.dataset.preset]); st.crest = p.crest; st.kits = p.kits; st.school.short = p.school.short; st.school.est = p.school.est; update(); return; }
      const kb = e.target.closest('[data-kit]'); if (kb) { st.active = kb.dataset.kit; update(); return; }
      const vb = e.target.closest('[data-view]'); if (vb) { st.view = vb.dataset.view; update(); return; }
      if (e.target.closest('[data-role=kitBig]')) { st.view = st.view === 'front' ? 'back' : 'front'; update(); return; }
      const role = e.target.closest('[data-role]') && e.target.closest('[data-role]').dataset.role;
      if (role === 'random') {
        const [p, s, t] = rpick(PALS), k = cur();
        Object.assign(k, { primary: p, secondary: s, trim: t, pattern: rpick(OPT.pattern)[0], collar: rpick(OPT.collar)[0] });
        const busy = ['stripes', 'hoops', 'halves', 'quarters', 'pinstripe'].includes(k.pattern);
        k.numColor = [s, t, '#ffffff', '#0b0b0c'].sort((a, b) => contrast(b, p) - contrast(a, p))[0];
        k.numStyle = busy && contrast(k.numColor, s) < 2.5 ? 'panel' : 'solid';
        const sw = Math.random() < .5; k.shorts = sw ? s : p; k.shortsTrim = sw ? p : s;
        const so = Math.random() < .6; k.socks = so ? p : s; k.socksBand = so ? s : p;
        update(); return;
      }
      if (role === 'reset') { const d = defaults(st.school.name); Object.assign(st, { crest: d.crest, kits: d.kits, school: d.school }); update(); toast && toast('已還原為預設的青葉綠'); return; }
      if (role === 'commit') { onCommit(); return; }
      if (role === 'discard') { onDiscard(); return; }
      const b = e.target.closest('.opt,.sw[data-val]'); if (!b) return;
      const holder = b.closest('[data-path]'); set(holder.dataset.path, b.dataset.val); update();
    });
    root.addEventListener('input', e => {
      const el = e.target;
      const holder = el.closest('[data-path]'); if (!holder || el.type === 'checkbox') return;
      set(holder.dataset.path, el.value); update();
    });
    root.addEventListener('change', e => {
      const el = e.target;
      if (el.type === 'checkbox') { set(el.dataset.path, el.checked); update(); }
    });
    update();
  }

  return { defaults, sig, crestSVG, kitSVG, teamDesign, teamCrest, mount, KITS };
})();

</script>
<script>
/* 高校足球物語 — interface */
(() => {
  const E = Engine;
  const SAVE = 'hsfc-save-v4';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ui = { tab: 'home', sel: null, slot: null, speed: 1, timer: null, paused: false, posFilter: 'ALL', toast: null, startPick: null };
  let S = null;

  // ---------- persistence ----------
  function saveSort() { try { localStorage.setItem('hsfc-sort', JSON.stringify([ui.sortKey, ui.sortDir])); } catch (e) {} }
  try { const s = JSON.parse(localStorage.getItem('hsfc-sort') || 'null'); if (s) { ui.sortKey = s[0]; ui.sortDir = s[1]; } } catch (e) {}
  function save() { if (!S || S.phase === 'match') return; try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }
  function loadSave() { try { const s = localStorage.getItem(SAVE); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function wipe() { try { localStorage.removeItem(SAVE); } catch (e) {} }

  // ---------- small helpers ----------
  const T = id => S.teams[id];
  const me = () => S.teams[S.me];
  const r0 = x => Math.round(x);
  const starStr = v => { let s = '<span class="st" aria-label="' + v + ' 星">'; for (let i = 1; i <= 5; i++) s += `<i class="${v >= i ? 'f' : v >= i - 0.5 ? 'h' : 'e'}">★</i>`; return s + '</span>'; };
  const myKit = () => { if (!S.kit) S.kit = Kit.defaults(me().name); S.kit.school.name = me().name; return S.kit; };
  const chip = t => t.id === S.me ? `<span class="crest kc" title="${esc(t.name)}">${Kit.crestSVG(myKit())}</span>` : `<span class="crest kc" title="${esc(t.name)}">${Kit.crestSVG(Kit.teamCrest(t))}</span>`;
  // home / away / GK kit thumbnail for a team in a given match
  const kitThumb = (t, key) => { const d = t.id === S.me ? myKit() : Kit.teamDesign(t); return `<span class="kthumb" title="${Kit.KITS[key]}球衣">${Kit.kitSVG(d, key, 'front', {})}</span>`; };
  const tname = t => `${chip(t)}<span>${esc(t.short)}</span>`;
  const bar = (v, max = 100, cls = '') => `<span class="bar ${cls}"><i style="width:${Math.max(2, Math.min(100, v / max * 100))}%"></i></span>`;
  const condCls = v => v >= 70 ? 'good' : v >= 45 ? 'warn' : 'bad';
  const FORM_ARROW = ['↓', '↘', '→', '↗', '↑'];
  const formBadge = (p, label = true) => { const f = E.formOf(p); return `<span class="fm f${f}" title="狀態${E.FORM_LV[f]}（${E.FORM_MOD[f] > 0 ? '+' : ''}${Math.round(E.FORM_MOD[f] * 100)}%）"><i>${FORM_ARROW[f]}</i>${label ? E.FORM_LV[f] : ''}</span>`; };
  const isCap = p => me() && me().captain === p.id;
  const capBadge = p => isCap(p) ? '<span class="cap" title="隊長">C</span>' : '';
  const roleTags = p => { const sp = (me() && me().sp) || {}; return [['corner', '角'], ['fk', '任'], ['pk', '點']].filter(([k]) => sp[k] === p.id).map(([, l]) => `<span class="rk" title="指定主罰">${l}</span>`).join(''); };
  const traitTag = p => p.trait ? `<span class="tag trait" title="${esc(E.TRAIT_DESC[p.trait])}">${p.trait}</span>` : '<span class="muted small">無</span>';
  const LINE_ROWS = [['中場', 'mid'], ['右路進攻', 'attR'], ['左路進攻', 'attL'], ['右路防守', 'defR'], ['左路防守', 'defL'], ['門將', 'gk']];
  const instBadge = p => { const v = (me().inst || {})[p.id]; return v === 'att' ? '<span class="ins att" title="趨向進攻">攻</span>' : v === 'def' ? '<span class="ins def" title="趨向防守">守</span>' : ''; };
  const POS_ORDER = { GK: 0, DF: 1, MF: 2, FW: 3 };
  const SORTS = {
    num: { label: '背號', dir: 1, v: p => p.num },
    pos: { label: '位置', dir: 1, v: p => POS_ORDER[p.pos] * 1000 - E.caOf(p) },
    ca: { label: '能力', dir: -1, v: p => E.caOf(p) },
    pa: { label: '潛力', dir: -1, v: p => p.pa },
    form: { label: '狀態', dir: -1, v: p => E.formOf(p) },
    grade: { label: '年級', dir: -1, v: p => p.grade },
    cond: { label: '體力', dir: -1, v: p => p.cond },
    apps: { label: '出賽', dir: -1, v: p => p.apps },
    goals: { label: '進球', dir: -1, v: p => p.goals },
    assists: { label: '助攻', dir: -1, v: p => p.assists },
    rating: { label: '評分', dir: -1, v: p => p.rN ? p.rSum / p.rN : 0 },
  };
  // one commentary line: minute, speaker (主播 / 球評) and text
  const feedLi = (f, typing) => `<li class="f-${f.kind}${f.spk ? ' spk-' + (f.spk === '球評' ? 'an' : 'pbp') : ''}${typing ? ' typing' : ''}"><span class="num muted">${f.min ? E.minLabel(f.min) + "'" : ''}</span><span>${f.spk ? `<b class="spk">${f.spk}</b>` : ''}${typing ? `<span id="typing-text">${esc(f.text.slice(0, Math.max(0, ui.typed)))}</span><i class="caret"></i>` : esc(f.text)}</span></li>`;
  const famTier = v => { const m = E.famMod(v); return m > 0 ? `全員能力 +${Math.round(m * 100)}%` : m < 0 ? '全員能力 −5%' : '全員能力 ±0%'; };
  const gradeLabel = g => ['國三', '高一', '高二', '高三'][g];
  function toast(msg) {
    if (!msg) return;
    const el = $('#toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(ui.toast); ui.toast = setTimeout(() => el.hidden = true, 2600);
  }
  function status(p) {
    if (p.inj > 0) return `<span class="tag bad">傷 ${p.inj}週</span>`;
    if (p.susp > 0) return `<span class="tag bad">禁賽 ${p.susp}</span>`;
    return '';
  }

  // ---------- start screen ----------
  function renderStart() {
    $('#app').style.removeProperty('--h');
    const saved = loadSave();
    const hue = (E.MY_SCHOOL * 137) % 360;
    $('#app').innerHTML = `
    <section class="start" style="--h:${hue}">
      <header class="start-head">
        
        <h1 class="display">高校足球物語</h1>
        <p class="lede">你是縣立青葉高校足球部新上任的總教練。球隊在最底層的都道府縣聯賽載浮載沉，三年一屆，球員來了又走。招對人、練對方法、排對戰術，從都道府縣聯賽一路升上王子聯賽、超級聯賽，再把青葉帶上地區之巔。</p>
        <div class="school-card"><span class="crest kc big">${Kit.crestSVG(saved && saved.kit ? saved.kit : Kit.defaults('青葉高校'))}</span><div><b class="school-name">青葉高校</b><div class="muted small">普通公立校・都道府縣聯賽・預算有限</div></div></div>
        ${saved ? `<div class="resume"><button class="btn primary" data-act="resume">繼續執教・${saved.coach ? esc(saved.coach) + ' 教練・' : ''}第 ${saved.year} 學年 ${E.monthOf(saved.week)}</button></div>` : ''}
        <form class="coach-form" id="coach-form">
          <label for="coach-name">總教練姓名</label>
          <div class="coach-row"><input id="coach-name" name="coach" type="text" maxlength="12" autocomplete="off" value="${esc(ui.coachDraft || '')}">
          <button class="btn ${saved ? 'ghost' : 'primary big'}" type="submit">${saved ? '以新教練重新開始' : '開始第一學年'}</button></div>
          <p class="coach-err small" id="coach-err" hidden>請輸入教練的名字。</p>
        </form>
      </header>
    </section>`;
  }

  // ---------- main shell ----------
  const TABS = [['home', '總覽'], ['squad', '球員'], ['train', '訓練'], ['tactics', '戰術'], ['recruit', '招生'], ['fixtures', '賽程'], ['table', '積分榜'], ['kit', '隊服']];
  function render() {
    if (!S) return renderStart();
    const t = me();
    const tab = E.standings(t.div), pos = tab.findIndex(r => r.t.id === t.id) + 1;
    const nxt = nextMatch();
    $('#app').style.setProperty('--h', t.hue);
    $('#app').innerHTML = `
      <header class="top" style="--h:${t.hue}">
        <div class="top-inner">
          <div class="who">${chip(t)}<div><div class="school-title">${esc(t.name)}</div><div class="muted small">${S.coach ? `總教練 ${esc(S.coach)}・` : ''}${E.TYPES[t.type].label}・名聲 ${t.rep}・預算 ${t.budget} 萬</div></div></div>
          <div class="when"><div class="cal"><span class="cal-y">第 ${S.year} 學年</span><span class="cal-m">${E.monthOf(S.week)}</span><span class="cal-w">第 ${Math.min(S.week, E.SEASON_LEN)} / ${E.SEASON_LEN} 週</span></div>
            <div class="small muted">${E.divName(t.div)} 第 ${pos} 名</div></div>
        </div>
        <nav class="tabs" role="tablist">${TABS.map(([k, l]) => `<button role="tab" aria-selected="${ui.tab === k}" class="tab ${ui.tab === k ? 'on' : ''}" data-act="tab" data-k="${k}">${l}${k === 'recruit' && S.week <= E.RECRUIT_DEADLINE && S.scoutPts > 0 ? `<span class="pip">${S.scoutPts}</span>` : ''}</button>`).join('')}</nav>
      </header>
      <main class="main">${({ home: vHome, squad: vSquad, train: vTrain, tactics: vTactics, recruit: vRecruit, fixtures: vFixtures, table: vTable, kit: vKit })[ui.tab]()}</main>
      <footer class="advance">
        <div class="advance-inner">
          <div class="next">${nxt ? `<span class="muted small">本週</span> ${nxt}` : `<span class="muted small">本週沒有比賽</span>${S.week <= E.SEASON_LEN ? weekNote() : ''}`}${scoutTag()}</div>
          <button class="btn primary big" data-act="advance">${S.phase === 'season' ? '查看學年總結' : myFix() ? '進入比賽' : '推進一週'}</button>
        </div>
      </footer>
      ${S.event && !(ui.showReport && S.lastMatch) ? vEvent() : ''}
      ${S.phase === 'season' && ui.showSeason ? vSeason() : ''}
      ${ui.sel ? vPlayer() : ''}
      ${S.recruitResult && !S.recruitSeen && !S.event ? vRecruitResult() : ''}
      ${ui.showReport && S.lastMatch ? vReport() : ''}`;
    if (ui.tab === 'kit') mountKit();
  }
  function vKit() { return `<div class="kit-head"><h2>隊服工房</h2><p class="muted small">設計${esc(me().name)}的隊徽與主場、客場、門將球衣。預覽以總教練的名字和 10 號呈現。隊徽會出現在遊戲各處，球衣會在賽前名單上亮相。</p></div><div id="kitroot" class="kitstudio"></div>`; }
  const KIT_COST = 5;
  function mountKit() {
    const root = document.getElementById('kitroot'); if (!root) return;
    const kit = myKit();
    if (!ui.kitDraft) ui.kitDraft = JSON.parse(JSON.stringify(kit));
    const d = ui.kitDraft;
    d.school.name = me().name; d.player = { name: S.coach || '', number: '10' }; kit.player = d.player;
    Kit.mount(root, d, { toast, committed: kit, locked: !!kit.locked, cost: KIT_COST, budget: me().budget,
      onCommit: () => {
        const paid = !!kit.locked;
        if (paid) { if (Kit.sig(d) === Kit.sig(kit)) return; if (me().budget < KIT_COST) { toast('預算不足，無法更改隊服。'); return; } me().budget -= KIT_COST; }
        S.kit = JSON.parse(JSON.stringify(d)); S.kit.locked = true; ui.kitDraft = null;
        save(); render(); toast(paid ? `隊服已更新，花費 ${KIT_COST} 萬元。` : '隊服已確定！之後更改每次需花費 5 萬元。');
      },
      onDiscard: () => { ui.kitDraft = null; render(); toast('已放棄變更。'); } });
  }

  const myFix = () => S.week <= E.SEASON_LEN ? E.myFixture(S.week) : null;
  const scoutTag = () => E.firstWeekOfMonth(S.week) && S.week <= E.RECRUIT_DEADLINE && S.scoutPts > 0 ? `<span class="tag good" title="到「招生」頁使用球探點數">球探出動週・剩 ${S.scoutPts} 點</span>` : '';
  function weekNote() {
    const w = S.week;
    for (const C of Object.values(E.CUPS)) if (w === C.draw) return `<span class="tag">${C.name}抽籤</span>`;
    for (const C of Object.values(E.CUPS)) if (w >= C.weeks[0] && w <= C.weeks.at(-1)) return `<span class="tag">${C.full}期間</span>`;
    if (w === E.RECRUIT_DEADLINE) return `<span class="tag warn">招生截止</span>`;
    if (w >= 14 && w <= 17) return `<span class="tag">暑假</span>`;
    return '';
  }
  function nextMatch() {
    const f = myFix(); if (!f) return '';
    const home = f.h === S.me, opp = T(home ? f.a : f.h);
    return `<b>${f.cup ? f.comp + ' ' + E.CUP_ROUNDS[f.cupRound] : f.comp + ' 第 ' + f.round + ' 輪'}</b>　${home ? '主場' : '客場'} vs ${tname(opp)}${me().rivals.includes(opp.id) ? '<span class="tag hot">宿敵</span>' : ''}`;
  }

  // ---------- overview ----------
  function lineCompare(a, b) {
    const rows = LINE_ROWS;
    return `<div class="duel">${rows.map(([l, k]) => {
      const x = a[k], y = b[k], tot = x + y;
      return `<div class="duel-row"><span class="num">${r0(x)}</span><span class="duel-bar"><i class="mine" style="width:${x / tot * 100}%"></i><i class="theirs" style="width:${y / tot * 100}%"></i></span><span class="num">${r0(y)}</span><span class="duel-l">${l}</span></div>`; }).join('')}</div>`;
  }
  function vHome() {
    const t = me(), f = myFix();
    let card = '';
    if (f) {
      const opp = T(f.h === S.me ? f.a : f.h);
      card = `<section class="card match-card">
        <div class="card-k">下一場比賽・${E.monthOf(S.week)}</div>
        <div class="vs"><div class="vs-side">${chip(t)}<b>${esc(t.short)}</b></div><div class="vs-mid">VS</div><div class="vs-side">${chip(opp)}<b>${esc(opp.short)}</b></div></div>
        <div class="muted small center">對手：${esc(opp.tactic.form)}・${esc(opp.tactic.style)}　｜　我方：${esc(t.tactic.form)}・${esc(t.tactic.style)}</div>
        ${lineCompare(E.teamLines(t), E.aiPredict(opp))}
        <div class="legend small"><span><i class="sw mine"></i>我方</span><span><i class="sw theirs"></i>${esc(opp.short)}</span></div>
      </section>`;
    } else {
      card = `<section class="card match-card"><div class="card-k">本週</div><p class="lede-sm">沒有正式比賽。${S.week >= 13 && S.week <= 16 ? '暑假是拉高訓練強度的好時機。' : S.week > 30 && S.week <= E.RECRUIT_DEADLINE ? '招生季進入最後衝刺，記得去「招生」頁面提出邀請。' : '專心訓練，調整陣容。'}</p>${lineCompare(E.teamLines(t), avgLines(t.div))}<div class="legend small"><span><i class="sw mine"></i>我方</span><span><i class="sw theirs"></i>${E.DIVS[t.div].short}平均</span></div></section>`;
    }
    const recent = S.results.slice(-6).reverse();
    const sq = E.squad(t);
    const hurt = sq.filter(p => p.inj > 0 || p.susp > 0);
    const tired = sq.filter(p => p.cond < 50 && p.inj <= 0);
    return `<div class="grid-home">
      ${card}
      <section class="card">
        <div class="card-k">近況</div>
        ${recent.length ? `<ul class="results">${recent.map(r => `<li><span class="res ${r.r > 0 ? 'w' : r.r < 0 ? 'l' : 'd'}">${r.r > 0 ? '勝' : r.r < 0 ? '敗' : '和'}</span><span class="score num">${r.gf}:${r.ga}${r.pk ? `<small> PK${r.pk[0]}:${r.pk[1]}</small>` : ''}</span><span>${r.home ? 'vs' : '@'} ${tname(T(r.opp))}</span><span class="muted small">${esc(r.comp)} ${esc(r.round)}</span></li>`).join('')}</ul>` : '<p class="muted">還沒有正式比賽。</p>'}
        ${S.lastMatch ? `<button class="btn ghost sm" data-act="report">上一場賽後報告</button>` : ''}
      </section>
      <section class="card">
        <div class="card-k">隊伍狀態</div>
        <div class="stat-row"><div><b class="num">${sq.length}</b><span class="muted small">名球員</span></div><div><b class="num">${hurt.length}</b><span class="muted small">傷停／禁賽</span></div><div><b class="num">${tired.length}</b><span class="muted small">體力偏低</span></div><div><b class="num">${sq.filter(p => E.formOf(p) >= 3).length}</b><span class="muted small">狀態高以上</span></div><div><b class="num">${sq.filter(p => E.formOf(p) <= 1).length}</b><span class="muted small">狀態低迷</span></div></div>
        ${hurt.length ? `<p class="small">${hurt.map(p => `${esc(p.name)} ${status(p)}`).join('　')}</p>` : ''}
        ${S.flags.principal ? '<p class="small"><span class="tag warn">校長目標</span> 高校選手權打進四強</p>' : ''}
      </section>
      <section class="card news">
        <div class="card-k">隊務日誌</div>
        <ul class="log">${S.log.slice(0, 14).map(l => `<li class="${l.kind}"><span class="muted small num">Y${l.year}・W${l.week}</span><span>${esc(l.text)}</span></li>`).join('')}</ul>
      </section>
    </div>`;
  }
  function avgLines(div) {
    const ts = S.teams.filter(t => t.div === div && t.id !== S.me).map(t => E.aiPredict(t));
    const o = { mid: 0, attR: 0, attL: 0, defR: 0, defL: 0, gk: 0 };
    ts.forEach(x => { for (const k in o) o[k] += x[k] / ts.length; });
    return o;
  }

  // ---------- squad ----------
  function vSquad() {
    const t = me();
    const order = { GK: 0, DF: 1, MF: 2, FW: 3 };
    const key = SORTS[ui.sortKey] ? ui.sortKey : 'pos', dir = ui.sortDir || SORTS[key].dir;
    const ps = E.squad(t).filter(p => ui.posFilter === 'ALL' || p.pos === ui.posFilter)
      .sort((a, b) => (SORTS[key].v(a) - SORTS[key].v(b)) * dir || order[a.pos] - order[b.pos] || a.num - b.num);
    const th = (k, label, cls = '') => `<th class="${cls}"><button class="sort ${key === k ? 'on' : ''}" data-act="sort" data-k="${k}" aria-label="依${label}排序">${label}${key === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
    const xi = new Set(E.validXI(t) ? t.xi : []);
    return `<section class="card wide">
      <div class="row-between"><div class="card-k">球員名單・${E.squad(t).length} 人</div>
        <div class="sort-bar"><label for="sort-sel" class="small muted">排序</label><select id="sort-sel" data-act="sortsel">${Object.entries(SORTS).map(([k, s]) => `<option value="${k}" ${key === k ? 'selected' : ''}>${s.label}</option>`).join('')}</select>
          <button class="btn sm" data-act="sortdir" aria-label="切換升降冪">${dir > 0 ? '小→大' : '大→小'}</button>
          <div class="seg">${['ALL', 'GK', 'DF', 'MF', 'FW'].map(k => `<button class="${ui.posFilter === k ? 'on' : ''}" data-act="pf" data-k="${k}">${k === 'ALL' ? '全部' : k}</button>`).join('')}</div></div></div>
      <div class="scroll-x"><table class="tbl players">
        <thead><tr>${th('num', '#')}<th>姓名</th>${th('pos', '位置')}${th('grade', '年級')}${th('ca', '能力', 'r')}${th('pa', '潛力')}${th('form', '狀態')}${th('cond', '體力')}${th('apps', '出賽', 'r')}${th('goals', '進球', 'r')}${th('assists', '助攻', 'r')}${th('rating', '評分', 'r')}<th>人格</th><th></th></tr></thead>
        <tbody>${ps.map(p => `<tr data-act="player" data-id="${p.id}" class="${xi.has(p.id) ? 'xi' : ''}">
          <td class="num muted">${p.num}</td><td><b>${esc(p.name)}</b>${capBadge(p)}${roleTags(p)}</td><td><span class="pos ${p.pos}">${p.pos}</span></td><td>${gradeLabel(p.grade)}</td>
          <td class="r num"><b>${r0(E.caOf(p))}</b>${p.lastGain > 0.05 ? `<small class="up">+${p.lastGain.toFixed(1)}</small>` : ''}</td>
          <td class="stars">${starStr(E.stars(p.pa))}</td>
          <td>${formBadge(p)}</td><td>${bar(p.cond, 100, condCls(p.cond))}</td>
          <td class="r num">${p.apps}</td><td class="r num">${p.goals}</td><td class="r num">${p.assists}</td><td class="r num">${p.rN ? (p.rSum / p.rN).toFixed(1) : '—'}</td>
          <td>${traitTag(p)}</td><td>${status(p)}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="muted small">底色標示目前的先發 11 人。狀態影響比賽中的全部能力：極低 −10%、低 −5%、一般 ±0、高 +5%、極高 +10%，每週會隨比賽表現與隊內事件變動。</p>
    </section>`;
  }
  function vPlayer() {
    const p = S.players[ui.sel] || S.prospects.find(x => x.id === ui.sel);
    if (!p) { ui.sel = null; return ''; }
    const isPros = p.grade === 0;
    const k = isPros ? p.know : 3;
    const attrs = E.ATTRS.filter(a => a !== 'gk').map(a => p.pos === 'GK' && a === 'wng' ? 'gk' : a); // GK shows 守門 in the 邊路 slot
    const ca = E.caOf(p);
    const fuzz = [99, 10, 5, 0][k];
    return `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(p.name)}"><div class="sheet">
      <button class="x" data-act="close" aria-label="關閉">×</button>
      <div class="ph"><span class="pos big ${p.pos}">${p.pos}</span><div><h3 class="display h3">${esc(p.name)}</h3><div class="muted small">${isPros ? esc(p.from) + '・國三' : '#' + p.num + '・' + gradeLabel(p.grade)}${k >= 2 ? `・人格 ${p.trait ? `<span class="tag trait">${p.trait}</span> <span class="small">${E.TRAIT_DESC[p.trait]}</span>` : '無'}` : ''}</div></div></div>
      <div class="kv"><div><span class="muted small">能力</span><b class="num">${k === 0 ? '??' : fuzz ? `${r0(ca - fuzz)}–${r0(ca + fuzz)}` : r0(ca)}</b></div><div><span class="muted small">潛力</span><b class="stars">${k >= 2 ? starStr(E.stars(p.pa)) : '？'}</b></div>${isPros ? '' : `<div><span class="muted small">入學時</span><b class="num">${p.start}</b></div><div><span class="muted small">狀態</span><b>${formBadge(p)}</b></div><div><span class="muted small">出賽／進球／助攻</span><b class="num">${p.apps}／${p.goals}／${p.assists}</b></div><div><span class="muted small">平均評分</span><b class="num">${p.rN ? (p.rSum / p.rN).toFixed(2) : '—'}</b></div>`}</div>
      <div class="attrs">${attrs.map(a => { const v = p.a[a]; return `<div class="attr"><span>${E.ATTR_LABEL[a]}</span>${k >= 2 ? bar(v, 99, 'attr-bar') : bar(0, 99)}<b class="num">${k >= 3 ? r0(v) : k === 2 ? `${r0(v - 4)}–${r0(v + 4)}` : '?'}</b></div>`; }).join('')}</div>
      ${isPros ? '' : (() => {
        const rows = (p.hist || []).map(h => ({ ...h, label: `第 ${h.year} 學年` })).concat([{ label: `第 ${S.year} 學年（本季）`, grade: p.grade, apps: p.apps, goals: p.goals, assists: p.assists, rSum: p.rSum, rN: p.rN }]);
        const tot = rows.reduce((t, r) => ({ apps: t.apps + r.apps, goals: t.goals + r.goals, assists: t.assists + r.assists, rSum: t.rSum + r.rSum, rN: t.rN + r.rN }), { apps: 0, goals: 0, assists: 0, rSum: 0, rN: 0 });
        const avg = r => r.rN ? (r.rSum / r.rN).toFixed(2) : '—';
        return `<div class="card-k" style="margin-top:12px">歷年成績</div><div class="scroll-x"><table class="tbl hist"><thead><tr><th>學年</th><th>年級</th><th class="r">出賽</th><th class="r">進球</th><th class="r">助攻</th><th class="r">平均評分</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.label}</td><td>${gradeLabel(r.grade)}</td><td class="r num">${r.apps}</td><td class="r num">${r.goals}</td><td class="r num">${r.assists}</td><td class="r num">${avg(r)}</td></tr>`).join('')}${rows.length > 1 ? `<tr class="tot"><td colspan="2"><b>合計</b></td><td class="r num"><b>${tot.apps}</b></td><td class="r num"><b>${tot.goals}</b></td><td class="r num"><b>${tot.assists}</b></td><td class="r num"><b>${avg(tot)}</b></td></tr>` : ''}</tbody></table></div>`;
      })()}
      ${isPros ? '' : `<div class="kv small"><div><span class="muted">體力</span>${bar(p.cond, 100, condCls(p.cond))}</div></div>
      ${p.team === S.me ? `<div class="roles"><label class="lbl" for="num-${p.id}">背號</label><select id="num-${p.id}" data-act="num" data-id="${p.id}">${Array.from({ length: 99 }, (_, i) => i + 1).map(n => { const h = E.squad(me()).find(q => q.num === n && q !== p); return `<option value="${n}" ${p.num === n ? 'selected' : ''}>${n}${h ? '（' + esc(h.name) + '，互換）' : ''}</option>`; }).join('')}</select>
        <button class="btn sm ${isCap(p) ? 'primary' : ''}" data-act="makecap" data-id="${p.id}">${isCap(p) ? '現任隊長' : '任命為隊長'}</button></div>` : ''}
      <p class="small muted">各位置適性：${['GK', 'DF', 'MF', 'FW'].map(pos => `${pos} ${r0(E.posRating(p, pos))}`).join('・')}</p>`}
    </div></div>`;
  }

  // ---------- training ----------
  function vTrain() {
    const t = me();
    const plan = t.train;
    const net = 16 + plan.reduce((s, m) => s + E.MENUS[m].cond, 0);
    const risk = plan.reduce((s, m) => s + E.MENUS[m].inj, 0);
    const focus = {}; plan.forEach(m => E.MENUS[m].attrs.forEach(a => focus[a] = (focus[a] || 0) + (E.MENUS[m].small ? 0.15 : 1)));
    const top = E.squad(t).filter(p => p.lastGain > 0).sort((a, b) => b.lastGain - a.lastGain).slice(0, 5);
    const menuNote = { '體能': '速度・體能・力量上升', '技術': '傳球・控球・射門上升', '戰術': '定位球・防守・守門上升', '分組對抗': '全能力小幅上升，狀態可能變好', '休息': '恢復體力' };
    return `<div class="grid-two">
      <section class="card wide">
        <div class="card-k">本週訓練菜單</div>
        <div class="week-plan">${E.DAYS.map((d, i) => `<div class="day"><div class="day-h">${d}</div>
          ${Object.keys(E.MENUS).map(m => `<button class="menu ${plan[i] === m ? 'on' : ''}" data-act="menu" data-i="${i}" data-m="${m}">${m}</button>`).join('')}</div>`).join('')}</div>
        <div class="stat-row">
          <div><b class="num ${net < 0 ? 'neg' : ''}">${net > 0 ? '+' : ''}${net}</b><span class="muted small">每週體力淨變化</span></div>
          <div><b>${risk >= 0.012 ? '<span class="tag bad">高</span>' : risk >= 0.006 ? '<span class="tag warn">中</span>' : '<span class="tag good">低</span>'}</b><span class="muted small">受傷風險</span></div>
          <div><b>${Object.entries(focus).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([a]) => E.ATTR_LABEL[a]).join('・') || '—'}</b><span class="muted small">主要成長</span></div>
        </div>
        <p class="muted small">比賽本身會消耗約 25 點體力。賽前一兩天排「休息」，比賽時球員狀態比較好。</p>
      </section>
      <section class="card">
        <div class="card-k">菜單說明</div>
        <dl class="defs">${Object.keys(E.MENUS).map(m => `<div><dt>${m}</dt><dd>${menuNote[m]}</dd></div>`).join('')}</dl>
      </section>
      <section class="card">
        <div class="card-k">陣型熟練度</div>
        ${Object.keys(E.FORMS).map(f => `<div class="attr"><span>${f}</span>${bar(t.fam[f] || 0, 100, (t.fam[f] || 0) >= 75 ? 'good' : (t.fam[f] || 0) < 50 ? 'bad' : 'neutral')}<b class="num">${r0(t.fam[f] || 0)}</b></div>`).join('')}
        <p class="muted small">49 以下全員能力 −5%・50–74 ±0%・75–99 +1%・100 +2%</p>
      </section>
    </div>`;
  }

  // ---------- tactics ----------
  function vTactics() {
    const t = me();
    const xi = E.ensureXI(t);
    const sl = E.slots(t);
    const rows = { FW: [], MF: [], DF: [], GK: [] };
    sl.forEach((pos, i) => rows[pos].push(i));
    const xiSet = new Set(xi);
    const bench = E.squad(t).filter(p => !xiSet.has(p.id)).sort((a, b) => E.caOf(b) - E.caOf(a));
    const slotHtml = i => { const p = S.players[xi[i]]; const pos = sl[i]; const r = E.posRating(p, pos); const off = p.pos !== pos;
      return `<button class="slot ${ui.slot === i ? 'on' : ''} ${off ? 'off' : ''}" data-act="slot" data-i="${i}"><span class="slot-num num">${p.num}</span><span class="slot-name">${capBadge(p)}<span class="tipname" data-tip="${p.id}" data-pos="${pos}">${esc(p.name)}</span>${instBadge(p)}</span><span class="slot-meta"><span class="pos ${pos}">${pos}</span> <b class="num">${r0(r)}</b> ${formBadge(p, false)}</span>${bar(p.cond, 100, condCls(p.cond))}</button>`; };
    const L = E.teamLines(t);
    return `<div class="grid-tac">
      <section class="card">
        <div class="card-k">陣型與戰術風格</div>
        <label class="lbl" for="sel-form">陣型</label>
        <div class="seg wrap" id="sel-form">${Object.keys(E.FORMS).map(f => `<button class="${t.tactic.form === f ? 'on' : ''}" data-act="form" data-k="${f}">${f}</button>`).join('')}</div>
        <label class="lbl" for="sel-style">戰術風格</label>
        <div class="seg wrap" id="sel-style">${E.STYLES.map(s => `<button class="${t.tactic.style === s ? 'on' : ''}" data-act="style" data-k="${s}">${s}</button>`).join('')}</div>
        <div class="beats small"><b>${t.tactic.style}</b>：${E.STYLE_DESC[t.tactic.style]}</div>
        <div class="card-k" style="margin-top:14px">目前陣容實力</div>
        ${LINE_ROWS.map(([l, k]) => `<div class="attr"><span>${l}</span>${bar(L[k], 90)}<b class="num">${r0(L[k])}</b></div>`).join('')}
        <p class="muted small">${t.tactic.form} 陣型熟練度 ${r0(t.fam[t.tactic.form] || 0)}（${famTier(t.fam[t.tactic.form] || 0)}）。有比賽的那一週，出賽用的陣型 +5、其他陣型 −2（最低 30）；沒有比賽的週不變。</p>
        <div class="card-k" style="margin-top:14px">隊長與定位球</div>
        ${roleSelect(t, 'captain', '隊長')}${roleSelect(t, 'corner', '角球')}${roleSelect(t, 'fk', '任意球')}${roleSelect(t, 'pk', '點球')}
        <p class="muted small">隊長具「領袖」人格時，在場上全隊能力 +1%。主罰者不在場上時，由場上定位球最高的球員代罰。</p>
      </section>
      <section class="card pitch-card">
        <div class="row-between"><div class="card-k">先發陣容</div><button class="btn ghost sm" data-act="autoxi">自動排最佳陣容</button></div>
        <div class="pitch" aria-label="球場陣型">${['FW', 'MF', 'DF', 'GK'].map(pos => rows[pos].length ? `<div class="prow">${rows[pos].map(slotHtml).join('')}</div>` : '').join('')}</div>
        ${ui.slot != null ? (() => { const p = S.players[xi[ui.slot]]; const v = (t.inst || {})[p.id] || ''; return `<div class="inst-row"><span><b>${esc(p.name)}</b> 的趨向</span><div class="seg">${Object.entries(E.INSTS).map(([k, l]) => `<button class="${v === k ? 'on' : ''}" data-act="inst" data-id="${p.id}" data-k="${k}">${l}</button>`).join('')}</div></div>`; })() : ''}
        <p class="muted small">${ui.slot != null ? `已選 ${sl[ui.slot]} 位置：設定趨向，或從右側點一位球員換上、點另一個場上位置互換。` : '點場上位置可設定球員趨向進攻或防守，或再點右側替補換人。紅框代表非本職位置（能力打折）。'}</p>
        <p class="muted small">趨向進攻：更多參與進攻、跑動稍多，防守貢獻減少。趨向防守則相反。</p>
      </section>
      <section class="card bench-card">
        <div class="card-k">替補與其他球員</div>
        <ul class="bench">${bench.map(p => `<li><button class="benchp" data-act="benchp" data-id="${p.id}" ${!E.available(p) ? 'aria-disabled="true"' : ''}><span class="pos ${p.pos}">${p.pos}</span><span class="b-name"><span class="tipname" data-tip="${p.id}" data-pos="${ui.slot != null ? sl[ui.slot] : p.pos}">${esc(p.name)}</span> ${formBadge(p, false)}</span><b class="num">${r0(ui.slot != null ? E.posRating(p, sl[ui.slot]) : E.caOf(p))}</b>${bar(p.cond, 100, condCls(p.cond))}${status(p)}</button></li>`).join('')}</ul>
      </section>
    </div>`;
  }

  function roleSelect(t, kind, label) {
    const cur = kind === 'captain' ? t.captain : (t.sp || {})[kind];
    const ps = E.squad(t).slice().sort(kind === 'captain' ? (a, b) => E.caOf(b) - E.caOf(a) : (a, b) => b.a.men - a.a.men);
    const xi = new Set(E.ensureXI(t));
    const auto = kind === 'captain' ? null : S.players[E.autoTaker(t.xi.filter((id, i) => E.slots(t)[i] !== 'GK'))];
    return `<div class="role-row"><label for="role-${kind}">${label}</label><select id="role-${kind}" data-act="setrole" data-k="${kind}">
      <option value="">${kind === 'captain' ? '未任命' : `自動（${auto ? esc(auto.name) : '—'}）`}</option>
      ${ps.map(p => `<option value="${p.id}" ${cur === p.id ? 'selected' : ''}>#${p.num} ${esc(p.name)}・${kind === 'captain' ? '能力 ' + r0(E.caOf(p)) + (p.trait === '領袖' ? '・領袖' : '') : '定位球 ' + r0(p.a.men)}${xi.has(p.id) ? '' : '（替補）'}</option>`).join('')}
    </select></div>`;
  }

  // ---------- recruit ----------
  function vRecruit() {
    const t = me();
    const slotsN = E.TYPES[t.type].slots;
    const offers = S.prospects.filter(p => p.offer);
    const cost = offers.reduce((s, p) => s + E.scholCost(p.schol), 0);
    const closed = S.week > E.RECRUIT_DEADLINE;
    const order = { GK: 0, DF: 1, MF: 2, FW: 3 };
    const list = S.prospects.filter(p => ui.posFilter === 'ALL' || p.pos === ui.posFilter)
      .sort((a, b) => (b.offer - a.offer) || (b.know - a.know) || order[a.pos] - order[b.pos]);
    const caTxt = p => { const c = E.caOf(p), f = [0, 10, 5, 0][p.know]; return p.know === 0 ? '??' : f ? `${r0(c - f)}–${r0(c + f)}` : r0(c); };
    return `<section class="card wide">
      <div class="recruit-head">
        <div><div class="card-k">國三球員・招生</div><p class="small muted">${closed ? '今年的招生已經結束，新生會在下一學年 4 月入隊。' : `第 ${E.RECRUIT_DEADLINE} 週（3 月）各校公布錄取名單。觀察讓報告更準確，親訪提高對方的興趣。球探只在每個月的第一週出動，每月 4 點，用不完不會累積。`}</p></div>
        <div class="stat-row tight">
          <div><b class="num">${S.scoutPts}</b><span class="muted small">${E.firstWeekOfMonth(S.week) ? '本月球探點數' : `下次出動：${E.nextScoutWeek(S.week) ? E.monthOf(E.nextScoutWeek(S.week)) + '第一週' : '—'}`}</span></div>
          <div><b class="num">${offers.length}/${slotsN}</b><span class="muted small">推薦名額</span></div>
          <div><b class="num">${cost}</b><span class="muted small">獎學金（萬，預算 ${t.budget}）</span></div>
        </div>
      </div>
      <div class="seg">${['ALL', 'GK', 'DF', 'MF', 'FW'].map(k => `<button class="${ui.posFilter === k ? 'on' : ''}" data-act="pf" data-k="${k}">${k === 'ALL' ? '全部' : k}</button>`).join('')}</div>
      <div class="scroll-x"><table class="tbl pros">
        <thead><tr><th>姓名</th><th>位置</th><th>國中</th><th class="r">能力</th><th>潛力</th><th>報告</th><th>對本校興趣</th><th>行動</th><th>入學邀請</th></tr></thead>
        <tbody>${list.map(p => `<tr class="${p.offer ? 'xi' : ''}">
          <td><button class="link" data-act="player" data-id="${p.id}"><b>${esc(p.name)}</b></button></td><td><span class="pos ${p.pos}">${p.pos}</span></td><td class="small">${esc(p.from)}</td>
          <td class="r num">${caTxt(p)}</td><td class="stars">${p.know >= 2 ? starStr(E.stars(p.pa)) : '？'}</td>
          <td><span class="know">${[0, 1, 2].map(i => `<i class="${p.know > i ? 'on' : ''}"></i>`).join('')}</span></td>
          <td>${bar(p.interest, 100, p.interest >= 60 ? 'good' : p.interest >= 35 ? 'warn' : 'bad')}</td>
          <td><div class="acts">${closed ? '' : `<button class="btn sm" data-act="watch" data-id="${p.id}" ${p.know >= 3 || S.scoutPts < 1 ? 'disabled' : ''}>觀察 1</button><button class="btn sm" data-act="visit" data-id="${p.id}" ${S.scoutPts < 2 || p.visitedWeek === S.week ? 'disabled' : ''}>親訪 2</button>`}</div></td>
          <td><div class="acts">${closed ? (p.offer ? '已邀請' : '') : `<select id="schol-${p.id}" data-act="schol" data-id="${p.id}" aria-label="獎學金"><option value="0" ${p.schol === 0 ? 'selected' : ''}>無獎學金</option><option value="1" ${p.schol === 1 ? 'selected' : ''}>半額 30萬</option><option value="2" ${p.schol === 2 ? 'selected' : ''}>全額 60萬</option></select><button class="btn sm ${p.offer ? 'primary' : ''}" data-act="offer" data-id="${p.id}">${p.offer ? '已邀請' : '邀請'}</button>`}</div></td>
        </tr>`).join('')}</tbody></table></div>
    </section>`;
  }
  function vRecruitResult() {
    const r = S.recruitResult;
    return `<div class="modal" role="dialog" aria-modal="true" aria-label="招生結果"><div class="sheet">
      <h3 class="display h3">招生放榜</h3>
      ${r.signed.length ? `<p>確定入學（下一學年 4 月入隊）：</p><ul class="plain">${r.signed.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : '<p>今年沒有球員選擇本校。下學年會從一般生的入社測驗補人。</p>'}
      ${r.lost.length ? `<p class="small muted">選擇他校：${r.lost.map(esc).join('、')}</p>` : ''}
      <button class="btn primary" data-act="recruitok">知道了</button>
    </div></div>`;
  }

  // ---------- fixtures & table ----------
  function bracket(key) {
    const C = E.CUPS[key], cup = S.cups && S.cups[key];
    if (!cup) return `<p class="muted small">第 ${C.draw} 週（${E.monthOf(C.draw)}）依三級聯賽的排名排出 1–32 號種子，1 號對 32 號，強隊在後段才會相遇。賽程：${C.weeks.map(w => E.monthOf(w)).filter((m, i, a) => a.indexOf(m) === i).join('、')}。</p>`;
    return `<div class="scroll-x"><div class="bracket">${cup.rounds.map((r, i) => `<div class="b-col"><div class="b-h">${E.CUP_ROUNDS[i]}・${E.monthOf(C.weeks[i])}</div>${r.map(m => `<div class="b-m ${m.h === S.me || m.a === S.me ? 'mine' : ''}">${[['h', 'hs'], ['a', 'as']].map(([k, s]) => `<div class="b-t ${m.w === m[k] ? 'win' : ''}">${tname(T(m[k]))}<span class="num">${m[s] ?? ''}${m.pk && m.w === m[k] ? '*' : ''}</span></div>`).join('')}</div>`).join('')}</div>`).join('')}</div></div>`;
  }
  function vFixtures() {
    const rows = [];
    for (let w = 1; w <= E.SEASON_LEN; w++) {
      const f = (S.fixtures[w] || []).find(x => x.h === S.me || x.a === S.me);
      if (f) { rows.push([w, f]); continue; }
      const C = Object.values(E.CUPS).find(c => c.weeks.includes(w));
      if (C && !(S.cups && S.cups[C.key])) rows.push([w, { tbd: true, comp: C.name, cupRound: C.weeks.indexOf(w) }]);
    }
    const label = f => f.cup || f.tbd ? `<span class="comp ${f.comp === '夏季大會' ? 'ih' : 'wc'}">${f.comp}</span> ${E.CUP_ROUNDS[f.cupRound]}` : `<span class="comp lg">聯賽</span> 第 ${f.round} 輪`;
    return `<div class="grid-two">
      <section class="card">
        <div class="card-k">本季賽程</div>
        <div class="scroll-x"><table class="tbl"><thead><tr><th>週</th><th>月</th><th>賽事</th><th>對手</th><th class="r">比分</th></tr></thead>
        <tbody>${rows.map(([w, f]) => { if (f.tbd) return `<tr class="${w === S.week ? 'now' : ''}"><td class="num">${w}</td><td>${E.monthOf(w)}</td><td class="small">${label(f)}</td><td class="muted small">抽籤後公布</td><td class="r num">—</td></tr>`;
          const home = f.h === S.me, opp = T(home ? f.a : f.h); const done = f.hs != null; const gf = home ? f.hs : f.as, ga = home ? f.as : f.hs;
          const res = !done ? '' : gf > ga || (f.pk && (home ? f.pk[0] > f.pk[1] : f.pk[1] > f.pk[0])) ? 'w' : gf < ga || f.pk ? 'l' : 'd';
          return `<tr class="${w === S.week ? 'now' : ''}"><td class="num">${w}</td><td>${E.monthOf(w)}</td><td class="small">${label(f)}</td><td>${home ? '' : '@ '}${tname(opp)}</td><td class="r num">${done ? `<span class="res ${res}">${gf}:${ga}${f.pk ? '*' : ''}</span>` : '—'}</td></tr>`; }).join('')}</tbody></table></div>
        <p class="muted small">高校聯賽全年進行；兩大盃賽期間聯賽暫停或隔週進行。* 為 PK 大戰。</p>
      </section>
      <div class="stack">
        <section class="card"><div class="card-k">${E.CUPS.ih.full}・5–6 月</div>${bracket('ih')}</section>
        <section class="card"><div class="card-k">${E.CUPS.wc.full}・9–11 月</div>${bracket('wc')}</section>
      </div>

  const STAT_ROWS = [

      const subIn = id => s.subsLog.find(x => x.in === id), subOut = id => s.subsLog.find(x => x.out === id);
      const row = (id, pos) => { const p = S.players[id]; const r = s.ratings[id]; const o = subOut(id), n = subIn(id);
        return `<li><span class="num muted">${p ? p.num : ''}</span><span class="pos ${pos}">${pos}</span><span class="ln">${pn(id)}${L.mvp === id ? ' <span class="mvp">MVP</span>' : ''}${g[id] ? ` <span class="ev">⚽${g[id] > 1 ? '×' + g[id] : ''}</span>` : ''}${as[id] ? ` <span class="ev ast">助${as[id] > 1 ? '×' + as[id] : ''}</span>` : ''}${cardOf(id)}${o ? ` <span class="ev out">↓${E.minLabel(o.min)}'</span>` : ''}${n ? ` <span class="ev in">↑${E.minLabel(n.min)}'</span>` : ''}</span><b class="num rt ${r >= 7.5 ? 'hi' : r < 6 ? 'lo' : ''}">${r != null ? r.toFixed(1) : '—'}</b></li>`; };
      const starters = s.start.map((id, i) => row(id, s.startPos[i])).join('');

      return `<div class="lu"><div class="lu-h">${tname(T(s.id))}<span class="muted small">${esc(s.form || '')}・${esc(s.style || '')}</span></div><ul class="lu-list">${starters}</ul>${subs ? `<div class="lu-sub muted small">替補上場</div><ul class="lu-list">${subs}</ul>` : ''}</div>`;

    const mv = x => x > 45 && x < 46 ? 45 + (x - 45) : x;
    const evs = [];
    [h, a].forEach((s, si) => {
      s.scorers.forEach(g => evs.push({ min: g.min, si, ic: '⚽', cls: 'goal', t: `${pn(g.id)}${g.ast ? `<span class="muted small">（助攻 ${pn(g.ast)}）</span>` : ''}` }));
      s.cards.forEach(c => evs.push({ min: c.min, si, ic: `<i class="card-ic ${c.type === 'y' ? 'y' : 'r'}"></i>`, cls: 'bk', t: `${pn(c.id)}${c.type === 'y2' ? '<span class="muted small">（兩黃變一紅）</span>' : c.type === 'r' ? '<span class="muted small">（紅牌）</span>' : ''}` }));
      s.subsLog.forEach(x => evs.push({ min: x.min, si, ic: '⇄', cls: 'sub', t: `<span class="ev in">↑</span>${pn(x.in)} <span class="ev out">↓</span>${pn(x.out)}` }));
    });
    evs.sort((x, y) => mv(x.min) - mv(y.min) || (x.cls === 'goal') - (y.cls === 'goal'));
    // running score after each goal, and the half-time score
    let sc = [0, 0];
    evs.forEach(x => { if (x.cls === 'goal') { sc[x.si]++; x.sc = sc.slice(); } });

    const evLi = x => `<li class="kev ${x.si ? 'away' : 'home'} ${x.cls}"><span class="kev-m num">${E.minLabel(x.min)}'</span><span class="kev-ic">${x.ic}</span><span class="kev-t">${x.t}${x.sc ? ` <b class="num kev-sc">${x.sc[0]}-${x.sc[1]}</b>` : ''}</span></li>`;

    const timeline = `<ol class="kev-list">${mark('開賽')}${evs.filter(x => mv(x.min) <= 45.5).map(evLi).join('')}${mark('中場', `${ht[0]}-${ht[1]}`)}${evs.filter(x => mv(x.min) > 45.5).map(evLi).join('')}${mark('終場', `${h.goals}-${a.goals}`)}${L.pk ? mark('PK 大戰', `${L.pk[0]}-${L.pk[1]}`) : ''}</ol>`;
    return `<div class="modal" role="dialog" aria-modal="true" aria-label="賽後報告"><div class="sheet report">

        <div class="rp-score num">${h.goals}<span>-</span>${a.goals}${L.pk ? `<small>PK ${L.pk[0]}-${L.pk[1]}</small>` : ''}</div>
        <div class="rp-team">${chip(T(a.id))}<b>${esc(T(a.id).short)}</b>${rankBadge(L.rankBefore && L.rankBefore[1], L.rankAfter && L.rankAfter[1])}</div>
      </div>
      ${h.scorers.length || a.scorers.length ? `<div class="rp-goals"><ul>${scorers(h)}</ul><span class="ball" aria-hidden="true">⚽</span><ul class="r">${scorers(a)}</ul></div>` : ''}
      <div class="rtabs" role="tablist">${[['feed', '賽況'], ['lineup', '陣容'], ['stats', '數據']].map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-act="rtab" data-k="${k}">${l}</button>`).join('')}</div>
      <div class="rp-body">
        ${tab === 'stats' ? statsTable(h, a) : tab === 'lineup' ? `<div class="lu-grid">${lineup(h)}${lineup(a)}</div>` :
